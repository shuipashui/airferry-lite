<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AirFerry Lite - 离线二维码发送端</title>
  <style>/*__STYLES__*/</style>
</head>
<body>
  <main class="shell">
    <section class="panel controls">
      <div class="brand"><span class="mark">AF</span><div><h1>AirFerry Lite</h1><p>单文件离线二维码发送端</p></div></div>
      <label class="drop" id="dropZone">
        <input id="fileInput" type="file">
        <strong id="fileLabel">选择或拖入一个文件</strong>
        <span>文件只在本机浏览器内处理，不会上传</span>
      </label>
      <div class="grid">
        <label>每帧数据
          <select id="chunkSize"><option value="1003">1003 B（四码稳妥）</option><option value="1273">1273 B（四码）</option><option value="1465">1465 B（低密度）</option><option value="2331" selected>2331 B（单码推荐）</option><option value="2953">2953 B（单码高吞吐）</option></select>
        </label>
        <label>播放帧率
          <select id="fps"><option value="20">20 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS（60 Hz 推荐）</option><option value="45">45 FPS（60 Hz 会落到 30）</option><option value="60">60 FPS（高刷四码）</option><option value="90">90 FPS（高刷屏）</option><option value="120">120 FPS（高刷屏）</option></select>
        </label>
        <label>二维码布局
          <select id="qrMode"><option value="single" selected>单码（兼容）</option><option value="quad">四码（多码吞吐）</option></select>
        </label>
      </div>
      <p class="tip" id="rateHint">理论速度：—</p>
      <div class="actions"><button id="prepareBtn" class="primary" disabled>生成二维码流</button><button id="playBtn" disabled>开始播放</button><button id="fullscreenBtn" disabled>全屏</button><button id="resetBtn" disabled>重置</button><a id="openReceiver" class="jump" target="_blank" rel="noopener">打开接收端</a></div>
      <div class="status"><div><span>状态</span><strong id="statusText">等待文件</strong></div><div><span>传输</span><strong id="compressText">—</strong></div><div><span>会话</span><strong id="sessionText">—</strong></div><div><span>片段</span><strong id="frameText">—</strong></div></div>
      <div class="progress"><i id="progressBar"></i></div>
      <p class="tip">四码请全屏。60 Hz 电脑用 30 FPS（每码显示两帧，比 60 FPS 更稳）；120 Hz 再用 60 FPS。四个码都要进手机画面。单码用 2331 B / 30 FPS；2953 B 只适合单码。四码每码上限 1273 B（QR V25），选更大的每帧数据不会再增加；更远或不稳可改 1003 B。理论速度是屏幕吞吐上限，喷泉码大约再加 15% 帧。</p>
    </section>
    <section class="panel viewer">
      <canvas id="qrCanvas" width="1080" height="1080"></canvas>
      <div class="overlay" id="overlay">
        <section class="receiver-link" aria-label="手机网页接收端">
          <div class="receiver-link-copy"><strong>手机网页接收端</strong><span>扫码后直接打开接收页面</span><a id="receiverUrl" target="_blank" rel="noopener"></a><small>选择文件并生成二维码流后，此入口会自动隐藏</small></div>
          <div class="receiver-qr-wrap"><canvas id="receiverQrCanvas" width="300" height="300" aria-label="手机接收端网址二维码"></canvas></div>
        </section>
      </div>
    </section>
  </main>
  <script>/*__QRCODE__*/</script>
  <script>/*__HIGHSPEED_PROTOCOL__*/</script>
  <script>/*__APP__*/</script>
</body>
</html>
