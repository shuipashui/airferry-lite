<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AirFerry Lite - 离线二维码发送端</title>
  <style>/*__STYLES__*/</style>
</head>
<body>
  <main class="shell">
    <section class="panel controls">
      <div class="brand"><span class="mark">AF</span><div><h1>AirFerry Lite</h1><p>单文件离线二维码发送端</p></div></div>
      <label class="drop" id="dropZone">
        <input id="fileInput" type="file">
        <strong id="fileLabel">选择或拖入一个文件</strong>
        <span>文件只在本机浏览器内处理，不会上传</span>
      </label>
      <div class="grid">
        <label>每帧数据
          <select id="chunkSize"><option value="1465">1465 B（低密度）</option><option value="2331" selected>2331 B（推荐）</option><option value="2953">2953 B（高吞吐）</option></select>
        </label>
        <label>播放帧率
          <select id="fps"><option value="24">24 FPS（稳定）</option><option value="30" selected>30 FPS（推荐）</option><option value="60">60 FPS（实验）</option></select>
        </label>
      </div>
      <div class="actions"><button id="prepareBtn" class="primary" disabled>生成二维码流</button><button id="playBtn" disabled>开始播放</button><button id="resetBtn" disabled>重置</button></div>
      <div class="status"><div><span>状态</span><strong id="statusText">等待文件</strong></div><div><span>会话</span><strong id="sessionText">—</strong></div><div><span>片段</span><strong id="frameText">—</strong></div></div>
      <div class="progress"><i id="progressBar"></i></div>
      <p class="tip">网页和 APK 统一使用 AFL2 高速协议。默认 2331 B / 30 FPS 适合 60 Hz 屏幕；60 FPS 保留给高刷新率屏幕和可稳定采集 60 FPS 的设备。</p>
    </section>
    <section class="panel viewer">
      <canvas id="qrCanvas" width="900" height="900"></canvas>
      <div class="overlay" id="overlay">
        <section class="receiver-link" aria-label="手机网页接收端">
          <div class="receiver-link-copy"><strong>手机网页接收端</strong><span>扫码后直接打开接收页面</span><a id="receiverUrl" target="_blank" rel="noopener"></a><small>选择文件并生成二维码流后，此入口会自动隐藏</small></div>
          <div class="receiver-qr-wrap"><canvas id="receiverQrCanvas" width="300" height="300" aria-label="手机接收端网址二维码"></canvas></div>
        </section>
      </div>
    </section>
  </main>
  <script>/*__QRCODE__*/</script>
  <script>/*__HIGHSPEED_PROTOCOL__*/</script>
  <script>/*__APP__*/</script>
</body>
</html>
